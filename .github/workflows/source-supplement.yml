name: Official appendix supplement
on:
  workflow_dispatch:
  push:
    branches: [feat/offline-resource-hall]
    paths: [.github/workflows/source-supplement.yml]
permissions:
  contents: read
jobs:
  supplement:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - name: Fetch observed official appendix and alternate PDF links
        run: |
          python - <<'PY'
          from pathlib import Path
          from airworthiness.acquire_http import Fetcher
          urls = [
            'https://xxgk.mot.gov.cn/gz/202112/P020240603531622519811.pdf',
            'https://xxgk.mot.gov.cn/gz/202112/W020211227544786493373.pdf',
            'https://xxgk.mot.gov.cn/gz/202208/W020220802378482532334.pdf',
          ]
          fetcher = Fetcher(Path('.cache/acquisition'), retries=1, timeout=(5, 20), deadline=90)
          for url in urls:
              try:
                  result = fetcher.fetch(url)
                  print('retrieved', result.url, len(result.data), result.original_sha256, flush=True)
              except Exception as exc:
                  print('failed', url, str(exc), flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-appendix-evidence
          retention-days: 3
          include-hidden-files: true
          path: |
            .cache/acquisition/*.bin
            .cache/acquisition/*.json
