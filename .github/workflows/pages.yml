name: Publish resource hall to GitHub Pages

on:
  push:
    branches: [feat/offline-resource-hall]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install build dependencies
        run: python -m pip install -e .
      - name: Validate source data and static adapter
        run: |
          python -m airworthiness.cli validate
          python -m unittest tests.test_static_export tests.test_static_frontend tests.test_reader_layout tests.test_public_pdfs -v
      - name: Fetch and hash-check eligible official PDFs
        run: python -m airworthiness.public_pdfs --root .
      - uses: actions/configure-pages@v5
      - name: Export the read-only resource hall
        run: python -m airworthiness.static_export --root . --output _site --base-path /airworthiness --include-originals
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
