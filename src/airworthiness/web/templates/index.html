<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>适航法规知识图谱系统</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* 基础样式重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
            line-height: 1.7;
            color: #334155; /* 深灰文字保证可读性 */
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%); /* 淡蓝灰渐变背景 */
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        /* 淡色科技网格背景 */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                linear-gradient(rgba(241, 245, 249, 0.8) 1px, transparent 1px),
                linear-gradient(90deg, rgba(241, 245, 249, 0.8) 1px, transparent 1px);
            background-size: 20px 20px;
            z-index: -1;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        /* 头部 - 淡蓝紫渐变+柔光 */
        .header {
            text-align: center;
            padding: 50px 20px;
            margin-bottom: 40px;
            background: linear-gradient(135deg, rgba(219, 234, 254, 0.8) 0%, rgba(237, 233, 254, 0.8) 100%); /* 淡蓝→淡紫 */
            border-radius: 12px;
            border: 1px solid rgba(165, 180, 252, 0.2); /* 淡紫边框 */
            box-shadow: 0 0 20px rgba(165, 180, 252, 0.1); /* 淡紫阴影 */
            position: relative;
            overflow: hidden;
        }

        .header::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(103, 232, 249, 0.08) 0%, transparent 70%); /* 淡青微光 */
            animation: float 8s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            50% { transform: translate(-20px, -20px) rotate(5deg); }
        }

        .header h1 {
            font-size: 2.5em;
            font-weight: 600;
            color: #1e293b; /* 深灰标题 */
            margin-bottom: 15px;
            text-shadow: 0 0 10px rgba(103, 232, 249, 0.3); /* 淡青光晕 */
            position: relative;
        }

        .header p {
            font-size: 1.1em;
            color: #64748b; /* 中灰副标题 */
            position: relative;
            max-width: 700px;
            margin: 0 auto;
        }

        /* 统计卡片 - 半透明白+淡色霓虹 */
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.7); /* 半透明白 */
            border-radius: 10px;
            padding: 25px 20px;
            text-align: center;
            border: 1px solid rgba(165, 180, 252, 0.15); /* 淡紫边框 */
            box-shadow: 0 0 15px rgba(165, 180, 252, 0.08); /* 淡紫弱阴影 */
            transition: all 0.3s ease;
            backdrop-filter: blur(5px); /* 模糊效果增强层次 */
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 0 25px rgba(165, 180, 252, 0.15); /*  hover增强阴影 */
            border-color: rgba(165, 180, 252, 0.3);
        }

        .stat-card i {
            font-size: 2.2em;
            margin-bottom: 15px;
            background: linear-gradient(135deg, #a5b4fc, #67e8f9); /* 淡紫→淡青渐变 */
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .stat-number {
            font-size: 2.5em;
            font-weight: 700;
            background: linear-gradient(135deg, #a5b4fc, #67e8f9); /* 同图标渐变 */
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 10px 0;
        }

        .stat-label {
            font-size: 1em;
            color: #64748b; /* 中灰标签 */
            font-weight: 500;
        }

        /* 搜索框 - 淡青边框+微光 */
        .search-box {
            margin: 30px 0;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 16px 20px;
            border: 1px solid rgba(103, 232, 249, 0.25); /* 淡青边框 */
            border-radius: 8px;
            font-size: 1em;
            background: rgba(255, 255, 255, 0.6); /* 半透明白 */
            color: #334155; /* 深灰文字 */
            transition: all 0.3s ease;
        }

        .search-input:focus {
            outline: none;
            border-color: #67e8f9; /* 淡青焦点 */
            box-shadow: 0 0 0 3px rgba(103, 232, 249, 0.15); /* 淡青光晕 */
        }

        .search-input::placeholder {
            color: #94a3b8; /* 浅灰占位符 */
        }

        .search-results {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: rgba(255, 255, 255, 0.95); /* 更透明白 */
            border: 1px solid rgba(103, 232, 249, 0.2); /* 淡青边框 */
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0,0,0,0.05); /* 弱阴影 */
            max-height: 350px;
            overflow-y: auto;
            z-index: 100;
            margin-top: 5px;
            backdrop-filter: blur(5px);
        }

        .search-result-item {
            padding: 15px 20px;
            border-bottom: 1px solid rgba(103, 232, 249, 0.1); /* 淡青分隔线 */
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .search-result-item:hover {
            background: rgba(241, 245, 249, 0.8); /* 淡蓝灰悬停 */
        }

        .result-type {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.8em;
            font-weight: 500;
            margin-right: 10px;
        }

        .type-chapter { background: rgba(56, 189, 248, 0.1); color: #0ea5e9; } /* 淡蓝 */
        .type-article { background: rgba(103, 232, 249, 0.1); color: #06b6d4; } /* 淡青 */
        .type-concept { background: rgba(167, 139, 250, 0.1); color: #8b5cf6; } /* 淡紫 */
        .type-method { background: rgba(52, 211, 153, 0.1); color: #10b981; } /* 淡绿 */

        /* 仪表盘 - 双栏布局+淡色分隔 */
        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 30px;
            margin-bottom: 40px;
        }

        .card {
            background: rgba(255, 255, 255, 0.7); /* 半透明白 */
            border-radius: 10px;
            padding: 25px;
            border: 1px solid rgba(165, 180, 252, 0.15); /* 淡紫边框 */
            box-shadow: 0 0 15px rgba(165, 180, 252, 0.08); /* 淡紫弱阴影 */
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
        }

        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 0 25px rgba(165, 180, 252, 0.15); /* hover增强 */
        }

        .card h2 {
            font-size: 1.3em;
            font-weight: 600;
            color: #1e293b; /* 深灰标题 */
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #a5b4fc; /* 淡紫下划线 */
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* 章节列表 - 淡蓝灰背景+淡青边框 */
        .chapter-list {
            max-height: 400px;
            overflow-y: auto;
            padding-right: 10px;
        }

        .chapter-list::-webkit-scrollbar {
            width: 5px;
        }

        .chapter-list::-webkit-scrollbar-track {
            background: rgba(241, 245, 249, 0.5); /* 淡蓝灰轨道 */
        }

        .chapter-list::-webkit-scrollbar-thumb {
            background: #a5b4fc; /* 淡紫滑块 */
            border-radius: 3px;
        }

        .chapter-item {
            padding: 18px;
            margin: 10px 0;
            background: rgba(241, 245, 249, 0.5); /* 淡蓝灰背景 */
            border-left: 3px solid #67e8f9; /* 淡青左边框 */
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .chapter-item:hover {
            background: rgba(255, 255, 255, 0.8); /* 更透明白 */
            transform: translateX(5px);
            border-left-color: #a5b4fc; /* 淡紫悬停 */
        }

        .chapter-item h3 {
            font-size: 1.1em;
            font-weight: 600;
            color: #1e293b; /* 深灰标题 */
            margin-bottom: 5px;
        }

        .chapter-item p {
            font-size: 0.95em;
            color: #64748b; /* 中灰描述 */
            line-height: 1.5;
        }

        /* 按钮 - 淡色渐变+微光 */
        .nav-buttons {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
            margin-top: 20px;
        }

        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            font-size: 0.95em;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-decoration: none;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.6s;
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn-primary {
            background: linear-gradient(135deg, #a5b4fc, #818cf8); /* 淡紫→淡蓝 */
            color: white;
            box-shadow: 0 0 10px rgba(165, 180, 252, 0.2);
        }

        .btn-primary:hover {
            box-shadow: 0 0 15px rgba(165, 180, 252, 0.3);
        }

        .btn-secondary {
            background: linear-gradient(135deg, #c4b5fd, #a78bfa); /* 更淡紫 */
            color: white;
            box-shadow: 0 0 10px rgba(196, 181, 253, 0.2);
        }

        .btn-secondary:hover {
            box-shadow: 0 0 15px rgba(196, 181, 253, 0.3);
        }

        .btn-success {
            background: linear-gradient(135deg, #6ee7b7, #34d399); /* 淡绿→绿 */
            color: white;
            box-shadow: 0 0 10px rgba(110, 231, 183, 0.2);
        }

        .btn-success:hover {
            box-shadow: 0 0 15px rgba(110, 231, 183, 0.3);
        }

        .btn-warning {
            background: linear-gradient(135deg, #fde68a, #fbbf24); /* 淡黄→黄 */
            color: white;
            box-shadow: 0 0 10px rgba(253, 230, 138, 0.2);
        }

        .btn-warning:hover {
            box-shadow: 0 0 15px rgba(253, 230, 138, 0.3);
        }

        /* 功能列表 - 淡青勾选 */
        .feature-list {
            margin-top: 20px;
            padding-left: 0;
        }

        .feature-list li {
            padding: 10px 0;
            color: #475569; /* 深灰文字 */
            list-style: none;
            position: relative;
            padding-left: 25px;
            border-bottom: 1px dashed rgba(103, 232, 249, 0.1); /* 淡青虚线 */
        }

        .feature-list li:last-child {
            border-bottom: none;
        }

        .feature-list li::before {
            content: '✓';
            position: absolute;
            left: 0;
            color: #67e8f9; /* 淡青勾选 */
            font-weight: bold;
        }

        /* 快捷操作 - 居中排列 */
        .quick-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 30px;
            justify-content: center;
        }

        /* 加载状态 - 淡色spinner */
        .loading {
            display: none;
            text-align: center;
            padding: 30px;
        }

        .spinner {
            border: 3px solid rgba(165, 180, 252, 0.15); /* 淡紫边框 */
            border-top: 3px solid #a5b4fc; /* 淡紫顶部 */
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* 模态框 - 淡色背景+淡紫边框 */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5); /* 半透明黑 */
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(3px);
        }

        .modal-content {
            background: rgba(255, 255, 255, 0.95); /* 透明白 */
            padding: 30px;
            border-radius: 10px;
            max-width: 900px;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 0 30px rgba(165, 180, 252, 0.15); /* 淡紫阴影 */
            border: 1px solid rgba(165, 180, 252, 0.25); /* 淡紫边框 */
            position: relative;
            backdrop-filter: blur(5px);
        }

        .modal-close {
            position: absolute;
            top: 15px;
            right: 15px;
            background: none;
            border: none;
            font-size: 1.5em;
            cursor: pointer;
            color: #94a3b8; /* 浅灰关闭按钮 */
            transition: color 0.3s ease;
        }

        .modal-close:hover {
            color: #a5b4fc; /* 淡紫悬停 */
        }

        .modal h2 {
            font-size: 1.5em;
            font-weight: 600;
            color: #1e293b; /* 深灰标题 */
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #a5b4fc; /* 淡紫下划线 */
        }
        .modal {
            /* 添加半透明黑色遮罩 */
            background: rgba(0,0,0,0.5);
            /* 添加过渡效果 */
            transition: opacity 0.3s ease;
        }

        .modal-content {
            /* 添加动画效果 */
            animation: modalAppear 0.3s ease-out;
        }

        @keyframes modalAppear {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .dashboard {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 1.8em;
            }

            .stats {
                grid-template-columns: repeat(2, 1fr);
            }

            .nav-buttons {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 480px) {
            .stats {
                grid-template-columns: 1fr;
            }

            .container {
                padding: 15px;
            }

            .card {
                padding: 20px;
            }
        }
        /* 搜索结果容器 */
        #searchResults {
            margin-top: 20px;
            max-height: 400px;
            overflow-y: auto;
            border: 1px solid #ddd;
            border-radius: 5px;
            display: none; /* 默认隐藏，有结果时显示 */
        }

        /* 单个搜索结果项 */
        .search-result-item {
            padding: 15px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .search-result-item:hover {
            background-color: #f5f5f5;
        }

        .search-result-item:last-child {
            border-bottom: none;
        }

        /* 结果项头部 */
        .result-header {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
        }

         .badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
            margin-right: 10px;
            color: white;
        }

        .badge-chapter { background-color: #4CAF50; }
        .badge-concept { background-color: #2196F3; }
        .badge-method { background-color: #FF9800; }
        .badge-article { background-color: #9C27B0; }
        .badge-html { background-color: #795548; }
        .badge-default { background-color: #607D8B; }

        /* 标题 */
        .result-title {
            margin: 0;
            font-size: 16px;
            color: #333;
        }

        /* 描述 */
        .result-description {
            margin: 5px 0;
            color: #666;
            font-size: 14px;
            line-height: 1.4;
        }

        /* 预览文本 */
        .result-preview {
            margin: 5px 0;
            color: #888;
            font-size: 13px;
            line-height: 1.3;
        }

        /* 章节信息 */
        .result-chapter {
            display: inline-block;
            margin-top: 8px;
            padding: 2px 8px;
            background-color: #f0f0f0;
            border-radius: 3px;
            font-size: 12px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 头部 -->
        <div class="header">
            <h1><i class="fas fa-plane"></i> 适航法规知识图谱系统</h1>
            <p>基于Neo4j的复合材料结构适航验证知识管理平台</p>
        </div>

        <!-- 统计卡片 -->
        <div class="stats">
            <div class="stat-card">
                <i class="fas fa-book"></i>
                <div class="stat-number" id="chapter-count">0</div>
                <div class="stat-label">知识章节</div>
            </div>
            <div class="stat-card">
                <i class="fas fa-gavel"></i>
                <div class="stat-number" id="article-count">0</div>
                <div class="stat-label">法规条款</div>
            </div>
            <div class="stat-card">
                <i class="fas fa-lightbulb"></i>
                <div class="stat-number" id="concept-count">0</div>
                <div class="stat-label">核心概念</div>
            </div>
            <div class="stat-card">
                <i class="fas fa-project-diagram"></i>
                <div class="stat-number" id="relation-count">0</div>
                <div class="stat-label">关系连接</div>
            </div>
        </div>

        <!-- 搜索框 -->
        <div class="search-box">
            <input type="text" class="search-input" id="searchInput"
                   placeholder="搜索知识节点 (如: 积木式验证, CCAR-25, 工艺鉴定...)"
                   onkeyup="searchKnowledge()">
            <div class="search-results" id="searchResults"></div>
        </div>

        <!-- 仪表盘 -->
        <div class="dashboard">
            <!-- 知识体系结构 -->
            <div class="card">
                <h2><i class="fas fa-sitemap"></i> 知识体系结构</h2>
                <div class="chapter-list" id="chapterList">
                    <div class="loading" id="chaptersLoading">
                        <div class="spinner"></div>
                        <p>加载中...</p>
                    </div>
                </div>
            </div>

            <!-- 系统功能 -->
            <div class="card">
                <h2><i class="fas fa-tools"></i> 系统功能</h2>
                <div class="nav-buttons">
                    <a href="/visualize" class="btn btn-primary">
                        <i class="fas fa-project-diagram"></i> 知识图谱可视化
                    </a>
                    <a href="/ai_query" class="btn btn-secondary">
                        <i class="fas fa-search"></i> 智能查询
                    </a>
                    <button class="btn btn-success" onclick="loadBuildingBlock()">
                        <i class="fas fa-cubes"></i> 积木式验证
                    </button>
                    <button class="btn btn-warning" onclick="loadComplianceMethods()">
                        <i class="fas fa-check-circle"></i> 合规方法
                    </button>
                </div>

                <h2 style="margin-top: 30px;"><i class="fas fa-info-circle"></i> 系统信息</h2>
                <p>本系统基于Neo4j图数据库构建，包含以下核心内容：</p>
                <ul class="feature-list">
                    <li>9个核心知识章节（覆盖适航验证全流程）</li>
                    <li>48条适航法规条款映射（CCAR-25/21等）</li>
                    <li>62个复合材料验证核心概念</li>
                    <li>135条智能关系连接（引用/包含/验证等）</li>
                </ul>
            </div>
        </div>

        <!-- 快捷操作 -->
        <div class="quick-actions">
            <button class="btn btn-primary" onclick="executeSampleQuery('章节引用法规')">
                <i class="fas fa-code-branch"></i> 查看章节引用关系
            </button>
            <button class="btn btn-secondary" onclick="executeSampleQuery('完整验证路径')">
                <i class="fas fa-road"></i> 验证路径推理
            </button>
            <button class="btn btn-success" onclick="executeSampleQuery('所有章节')">
                <i class="fas fa-redo"></i> 刷新数据
            </button>
        </div>
    </div>

    <script>
        // 加载章节列表
        async function loadChapters() {
            const loading = document.getElementById('chaptersLoading');
            const chapterList = document.getElementById('chapterList');

            loading.style.display = 'block';
            chapterList.innerHTML = '';

            try {
                const response = await fetch('/chapters');
                const chapters = await response.json();

                chapters.forEach(chapter => {
                    const chapterDiv = document.createElement('div');
                    chapterDiv.className = 'chapter-item';

                    // 移除原来的整个div点击事件，改为按钮点击
                    chapterDiv.innerHTML = `
                        <h3>第${chapter.id}章: ${chapter.title}</h3>
                        <p>${chapter.description}</p>
                        <div style="margin-top: 15px; display: flex; gap: 10px; flex-wrap: wrap;">
                            <button class="btn btn-primary" onclick="viewChapterDetail(${chapter.id})"
                                    style="padding: 8px 15px; font-size: 0.9em;">
                                <i class="fas fa-eye"></i> 快速预览
                            </button>
                            <a href="/chapter/${chapter.id}/detail" class="btn btn-secondary"
                               style="padding: 8px 15px; font-size: 0.9em; text-decoration: none;">
                                <i class="fas fa-external-link-alt"></i> 详情页面
                            </a>
                        </div>
                    `;
                    chapterList.appendChild(chapterDiv);
                });

                document.getElementById('chapter-count').textContent = chapters.length;
            } catch (error) {
                console.error('加载章节失败:', error);
                chapterList.innerHTML = '<p style="color: #ef4444; text-align: center; padding: 20px;">加载失败，请检查网络</p>';
            } finally {
                loading.style.display = 'none';
            }
        }

            // 查看章节详情（模态框版）
        async function viewChapterDetail(chapterId) {
            // 关闭所有已打开的模态框
            closeAllModals();

            try {
                const response = await fetch(`/chapter/${chapterId}`);
                const data = await response.json();

                const modal = document.createElement('div');
                modal.className = 'modal';
                modal.innerHTML = `
                    <div class="modal-content">
                        <button class="modal-close" onclick="closeModal(this)">&times;</button>
                        <h2>第${data.chapter.id}章: ${data.chapter.title}</h2>

                        <div style="margin: 20px 0;">
                            <h3 style="font-size: 1.1em; color: #64748b; margin-bottom: 10px;">章节描述</h3>
                            <p style="background: rgba(241, 245, 249, 0.7); padding: 15px; border-radius: 6px;">${data.chapter.description}</p>
                        </div>

                        <div style="display: flex; gap: 15px; margin: 20px 0; flex-wrap: wrap;">
                            ${data.prev_chapter ? `
                                <button class="btn btn-primary" onclick="viewChapterDetail(${data.prev_chapter.id})">
                                    ← 上一章: ${data.prev_chapter.title}
                                </button>
                            ` : ''}
                            <!-- 新增的详情页面按钮 -->
                            <button class="btn btn-success" onclick="window.location.href='/chapter/${data.chapter.id}/detail'">
                                <i class="fas fa-external-link-alt"></i> 打开详情页面
                            </button>
                            ${data.next_chapter ? `
                                <button class="btn btn-primary" onclick="viewChapterDetail(${data.next_chapter.id})">
                                    下一章: ${data.next_chapter.title} →
                                </button>
                            ` : ''}
                        </div>

                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                            <div>
                                <h3 style="font-size: 1.1em; color: #64748b; margin-bottom: 10px;">相关法规</h3>
                                ${data.articles?.length ? data.articles.map(a => `
                                    <div style="background: rgba(16, 185, 129, 0.1); padding: 12px; margin: 8px 0; border-radius: 6px; border-left: 3px solid #10b981;">
                                        <strong>${a.code}</strong><br><small>${a.title}</small>
                                    </div>
                                `).join('') : '<p style="color: #64748b;">无相关法规</p>'}
                            </div>
                            <div>
                                <h3 style="font-size: 1.1em; color: #64748b; margin-bottom: 10px;">核心概念</h3>
                                ${data.concepts?.length ? data.concepts.map(c => `
                                    <div style="background: rgba(239, 68, 68, 0.1); padding: 12px; margin: 8px 0; border-radius: 6px; border-left: 3px solid #ef4444;">
                                        <strong>${c.name}</strong><br><small>${c.description}</small>
                                    </div>
                                `).join('') : '<p style="color: #64748b;">无相关概念</p>'}
                            </div>
                        </div>
                    </div>
                `;

                document.body.appendChild(modal);
            } catch (error) {
                console.error('加载章节详情失败:', error);
                alert('加载失败，请重试');
            }
        }

            // 关闭单个模态框
            function closeModal(button) {
                const modal = button.closest('.modal');
                if (modal) modal.remove();
            }

            // 关闭所有模态框
            function closeAllModals() {
                const modals = document.querySelectorAll('.modal');
                modals.forEach(modal => modal.remove());
            }

            // 点击页面关闭模态框
            document.addEventListener('click', (e) => {
                // 关闭搜索结果
                if (!e.target.closest('.search-box')) {
                    document.getElementById('searchResults').style.display = 'none';
                }

                // 点击模态框外部关闭模态框
                if (e.target.classList.contains('modal')) {
                    e.target.remove();
                }
            });

        function displaySearchResults(results) {
            const resultsDiv = document.getElementById('searchResults');
            resultsDiv.innerHTML = ''; // 清空之前的结果

            if (!results || results.length === 0) {
                resultsDiv.innerHTML = '<div class="search-result-item">未找到相关结果。</div>';
                resultsDiv.style.display = 'block';
                return;
            }

            // 遍历所有结果并创建HTML元素
            results.forEach(item => {
                const resultItem = document.createElement('div');
                resultItem.className = 'search-result-item';

                // 根据不同的结果类型设置不同的样式
                let typeBadge = '';
                let badgeClass = '';

                switch(item.type) {
                    case 'chapter':
                        badgeClass = 'badge-chapter';
                        typeBadge = '章节';
                        break;
                    case 'concept':
                        badgeClass = 'badge-concept';
                        typeBadge = '概念';
                        break;
                    case 'method':
                        badgeClass = 'badge-method';
                        typeBadge = '方法';
                        break;
                    case 'article':
                        badgeClass = 'badge-article';
                        typeBadge = '条款';
                        break;
                    case 'html_content':
                        badgeClass = 'badge-html';
                        typeBadge = '详情页';
                        break;
                    default:
                        badgeClass = 'badge-default';
                        typeBadge = item.type || '未知';
                }

                // 构建结果项的HTML
                resultItem.innerHTML = `
                    <div class="result-header">
                        <span class="badge ${badgeClass}">${typeBadge}</span>
                        <h3 class="result-title">${item.title || '无标题'}</h3>
                    </div>
                    <div class="result-content">
                        <p class="result-description">${item.description || '无描述'}</p>
                        ${item.preview ? `<p class="result-preview"><em>${item.preview}</em></p>` : ''}
                        ${item.chapter_id ? `<span class="result-chapter">所属章节: 第${item.chapter_id}章</span>` : ''}
                    </div>
                `;

                // 添加点击事件（根据您的需求调整）
                resultItem.addEventListener('click', function() {
                    if (item.type === 'chapter' || item.type === 'html_content') {
                        // 跳转到对应章节
                        window.location.href = `/chapter/${item.chapter_id}/detail`;
                    } else if (item.id && item.id.startsWith('concept_')) {
                        // 跳转到概念详情页
                        window.location.href = `/concept/${item.id}`;
                    }
                    // 可以根据需要添加其他类型的点击处理
                });

                resultsDiv.appendChild(resultItem);
            });

            resultsDiv.style.display = 'block';
        }

        // 搜索知识
        let searchTimeout;
        async function searchKnowledge() {
            const query = document.getElementById('searchInput').value.trim();
            const resultsDiv = document.getElementById('searchResults');
            resultsDiv.innerHTML = ''; // 清空先前结果
            resultsDiv.style.display = 'none';

            if (!query) {
                    resultsDiv.innerHTML = '';
                    resultsDiv.style.display = 'none';
                    return; // 直接退出函数，不发送请求
                }

            try {
                const response = await fetch(`/search?q=${encodeURIComponent(query)}`);

                // 检查HTTP响应状态是否成功
                if (!response.ok) {
                    throw new Error(`网络请求失败: ${response.status} ${response.statusText}`);
                }

                const results = await response.json(); // 解析JSON

                displaySearchResults(results);
            } catch (networkError) {
                // 这里只捕获网络请求或JSON解析错误
                console.error('搜索请求失败:', networkError);
                // 可以更友好地提示网络问题
                resultsDiv.innerHTML = `<div class="search-result-item">连接服务器失败，请检查网络连接后重试。</div>`;
                resultsDiv.style.display = 'block';
            }
        }

        // 查看搜索结果
        function viewSearchResult(id, type) {
            alert(`查看节点 ID: ${id}, 类型: ${type}`);
            document.getElementById('searchResults').style.display = 'none';
            document.getElementById('searchInput').value = '';
        }

        // 加载积木式验证
        async function loadBuildingBlock() {
            try {
                const query = `
                    MATCH path = (b1:BuildingBlock)-[:NEXT_LEVEL*]->(b2:BuildingBlock)
                    RETURN b1.level as start_level, b1.name as start_name, b1.description as start_desc,
                           b2.level as end_level, b2.name as end_name, b2.description as end_desc
                    ORDER BY b1.level
                `;

                const response = await fetch('/query', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query })
                });

                const data = await response.json();
                showModal('积木式验证方法', renderBuildingBlock(data.data));
            } catch (error) {
                console.error('加载失败:', error);
                alert('加载失败');
            }
        }

        // 加载合规方法
        async function loadComplianceMethods() {
            try {
                const query = `
                    MATCH (a:Article)-[:CAN_COMPLY_WITH]->(m:ComplianceMethod)
                    RETURN a.code as article_code, a.title as article_title,
                           collect(m.name) as compliance_methods
                    ORDER BY a.code
                `;

                const response = await fetch('/query', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query })
                });

                const data = await response.json();
                showModal('合规方法映射', renderComplianceMethods(data.data));
            } catch (error) {
                console.error('加载失败:', error);
                alert('加载失败');
            }
        }

        // 渲染积木式验证数据
        function renderBuildingBlock(data) {
            if (!data?.length) return '<p style="color: #64748b; text-align: center;">暂无数据</p>';

            return data.map(item => `
                <div style="background: rgba(241, 245, 249, 0.7); padding: 15px; margin: 10px 0; border-radius: 6px; border-left: 3px solid #67e8f9;">
                    <div style="display: grid; grid-template-columns: 1fr auto 1fr; gap: 15px; align-items: center;">
                        <div>
                            <strong>层级 ${item.start_level}: ${item.start_name}</strong>
                            <p style="margin-top: 5px; color: #64748b;">${item.start_desc}</p>
                        </div>
                        <i class="fas fa-arrow-right" style="color: #a5b4fc;"></i>
                        <div style="text-align: right;">
                            <strong>层级 ${item.end_level}: ${item.end_name}</strong>
                            <p style="margin-top: 5px; color: #64748b;">${item.end_desc}</p>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // 渲染合规方法数据
        function renderComplianceMethods(data) {
            if (!data?.length) return '<p style="color: #64748b; text-align: center;">暂无数据</p>';

            return data.map(item => `
                <div style="background: rgba(16, 185, 129, 0.1); padding: 15px; margin: 10px 0; border-radius: 6px; border-left: 3px solid #10b981;">
                    <strong>${item.article_code} ${item.article_title}</strong>
                    <div style="margin-top: 10px;">
                        ${item.compliance_methods.map(m => `
                            <span style="background: rgba(16, 185, 129, 0.2); color: #10b981; padding: 4px 10px; border-radius: 12px; font-size: 0.9em; margin-right: 5px;">
                                ${m}
                            </span>
                        `).join('')}
                    </div>
                </div>
            `).join('');
        }

        // 显示模态框
        function showModal(title, content) {
            const modal = document.createElement('div');
            modal.className = 'modal';
            modal.innerHTML = `
                <div class="modal-content">
                    <button class="modal-close" onclick="this.closest('.modal').remove()">&times;</button>
                    <h2>${title}</h2>
                    <div style="margin-top: 20px;">${content}</div>
                </div>
            `;
            document.body.appendChild(modal);
        }

        // 执行示例查询
        async function executeSampleQuery(type) {
            let query = '';
            switch(type) {
                case '所有章节':
                    query = 'MATCH (c:Chapter) RETURN c.id, c.title, c.description ORDER BY c.id';
                    break;
                case '章节引用法规':
                    query = `MATCH (c:Chapter)-[:REFERENCES]->(a:Article) RETURN c.id, c.title, a.code, a.title ORDER BY c.id`;
                    break;
                case '完整验证路径':
                    query = `MATCH (mat:Chapter {id:3})-[:NEXT_CHAPTER]->(proc:Chapter {id:4})-[:NEXT_CHAPTER]->(verify:Chapter {id:7})
                            MATCH (verify)-[:USES_METHOD]->(bb:BuildingBlock)
                            RETURN mat.title, proc.title, verify.title, bb.name`;
                    break;
            }

            try {
                const response = await fetch('/query', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query })
                });

                const data = await response.json();
                showModal(type + ' - 结果', `
                    <pre style="background: rgba(241, 245, 249, 0.7); padding: 15px; border-radius: 6px; overflow-x: auto; color: #334155;">
                        ${JSON.stringify(data.data, null, 2)}
                    </pre>
                `);
            } catch (error) {
                console.error('查询失败:', error);
                alert('查询失败');
            }
        }

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', () => {
            loadChapters();

            // 模拟统计数据（实际应从接口获取）
            setTimeout(() => {
                document.getElementById('article-count').textContent = '42';
                document.getElementById('concept-count').textContent = '56';
                document.getElementById('relation-count').textContent = '128';
            }, 1000);

            // 点击页面关闭搜索结果
            document.addEventListener('click', (e) => {
                if (!e.target.closest('.search-box')) {
                    document.getElementById('searchResults').style.display = 'none';
                }
            });
        });
    </script>
</body>
