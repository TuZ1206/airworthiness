[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "airworthiness"
version = "0.2.0"
description = "九章适航法规离线资源大厅"
requires-python = ">=3.11"
dependencies = [
    "Flask>=3.1,<4",
    "waitress>=3.0.2,<4",
    "beautifulsoup4>=4.12,<5",
    "Markdown>=3.7,<4",
    "bleach>=6.2,<7",
    "requests>=2.32,<3",
    "PyMuPDF>=1.25,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
airworthiness = "airworthiness.cli:main"

[tool.setuptools.package-data]
airworthiness = ["web/templates/*.html", "web/static/*.css", "web/static/*.js"]
